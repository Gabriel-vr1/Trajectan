name: Verify Trajectan
on: [push, pull_request]
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '24', cache: npm, cache-dependency-path: frontend/package-lock.json }
      - run: pip install -r backend/requirements-azure.txt
      - run: pytest -q
      - run: npm ci && npm run build && npx playwright install --with-deps chromium
        working-directory: frontend
      - name: Compile Azure deployment templates
        run: az bicep build --file infra/main.bicep --outfile /tmp/trajectan-template.json
      - name: Build production container
        run: docker build -f infra/Dockerfile -t trajectan:ci .
      - name: Start production container
        run: docker run -d --name trajectan-ci -p 127.0.0.1:8000:8000 trajectan:ci
      - run: python scripts/wait_ready.py
      - run: python scripts/smoke.py http://127.0.0.1:8000
      - run: npm run test:e2e
        working-directory: frontend
      - name: Preserve verified production image
        run: docker save trajectan:ci | gzip > /tmp/trajectan-image.tar.gz
      - uses: actions/upload-artifact@v4
        with:
          name: production-image-and-template
          compression-level: 0
          retention-days: 14
          path: |
            /tmp/trajectan-image.tar.gz
            /tmp/trajectan-template.json
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: browser-evidence
          path: |
            docs/screenshots
            frontend/test-results
      - name: Container logs
        if: always()
        run: docker logs trajectan-ci
